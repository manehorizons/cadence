version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node major versions track Node.js release lines. This repo's
      # floor is engines.node >=22 and CI only tests Node 22 — a major
      # bump past that (e.g. to a 25.x/26.x line) would typecheck against a
      # Node API surface the repo never runs or tests against.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
