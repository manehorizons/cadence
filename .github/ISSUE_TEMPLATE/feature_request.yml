name: Feature request
description: Propose a new capability or an improvement to CADENCE.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please skim `DESIGN.md` — CADENCE has explicit
        **anti-goals**, and some ideas are deliberately out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that CADENCE makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Sketch the CLI/flag/config shape if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one is better.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI engine
        - Claude Code adapter
        - Both
        - Not sure
    validations:
      required: true
