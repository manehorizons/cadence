# TEMPORARY — phase 50 iteration scaffold. Windows-only fast lane that runs
# ONLY the test files that failed on windows-latest in PR #19, so each fix
# attempt gets ~2-3min feedback instead of the full ~6min matrix. Deleted in
# task T4 once the real windows-latest matrix leg is re-enabled and green.
name: _windows-probe (temporary)

on:
  push:
    branches: [feat/50-windows-ci-leg]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: testkit — fixture cleanup
        run: pnpm --filter @manehorizons/cadence-testkit test -- tests/fixture.test.ts
      - name: core — slow Windows tests
        run: pnpm --filter @manehorizons/cadence-core test -- tests/cli/settle-security-audit.test.ts tests/hooks/dispatcher.test.ts
