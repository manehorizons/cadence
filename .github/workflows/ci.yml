name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI runs the full gate on ubuntu + macOS across Node 20 + 22. The macOS leg
# was unblocked by realpath'ing the testkit mkdtemp root (phase 49) — without
# it, a child spawned with cwd=root reports /private/tmp while tests read back
# at /tmp. fail-fast is off so one OS leg's failure never cancels the others.
#
# The windows-latest leg is still deferred: enabling it surfaced Windows-only
# test-harness issues distinct from the macOS path bug — `settle-security-audit`
# and `dispatcher` (100-write cap) tests exceed the vitest timeout on Windows
# runners, and temp-dir cleanup hits EBUSY (open handle) past the fixture's rm
# retry budget. That work is tracked as a follow-up (see the recommendation
# ledger) rather than band-aided with per-test timeout bumps here.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Single stable status context for branch protection. Kept as its own job so
  # the required-check name stays `ci-success` independent of the matrix shape.
  ci-success:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the test job did not succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "test job succeeded"
