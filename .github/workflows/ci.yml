name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI runs the full gate on GitHub-hosted Ubuntu runners across Node 20 + 22.
# macOS and Windows legs are deferred pending a cross-platform test-harness
# fix: several tests assert absolute temp paths that the OS rewrites
# (macOS /tmp→/private/tmp realpath; a Windows writeFile→spawn flush race) —
# test-harness artifacts, not product bugs. Re-add those legs once the harness
# resolves temp paths portably and they're verified green.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Single stable status context for branch protection. Kept as its own job so
  # the required-check name stays `ci-success` independent of the matrix shape.
  ci-success:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the test job did not succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "test job succeeded"
