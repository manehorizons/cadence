name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dev-time CI runs on a single self-hosted Linux runner (Node 20 only)
# to avoid GitHub-hosted Actions minutes. The full multi-OS × Node 20+22
# matrix (against GitHub-hosted runners) returns at the v1.2 public-
# release milestone — restore the previous strategy block before tagging.
jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Single stable status context for branch protection. Kept even with a
  # single `test` job so the required-check name stays `ci-success`
  # across the dev-time → release-time matrix change.
  ci-success:
    if: always()
    needs: [test]
    runs-on: [self-hosted, linux]
    steps:
      - name: Fail if the test job did not succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "test job succeeded"
