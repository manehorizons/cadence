name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI runs the full gate on ubuntu + macOS + windows across Node 20 + 22.
# macOS was unblocked by realpath'ing the testkit mkdtemp root (phase 49);
# windows by platform-aware test timeouts (vitest.shared.ts) + best-effort
# temp cleanup that tolerates Windows handle-locking (phase 50). fail-fast is
# off so one OS leg's failure never cancels the others.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Single stable status context for branch protection. Kept as its own job so
  # the required-check name stays `ci-success` independent of the matrix shape.
  ci-success:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the test job did not succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "test job succeeded"
