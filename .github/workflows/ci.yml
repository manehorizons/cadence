name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI runs the full gate on GitHub-hosted runners across Node 20 + 22 on Ubuntu
# and macOS. A windows-latest leg is intentionally deferred: three Slice-34.4
# recommendation tests hit a Windows-only writeFile→spawn flush race in the
# test harness (a test-harness artifact, not a product bug). Restore a Windows
# leg once that race is fixed and verified green.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Single stable status context for branch protection. Kept as its own job so
  # the required-check name stays `ci-success` independent of the matrix shape.
  ci-success:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the test job did not succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "test job succeeded"
