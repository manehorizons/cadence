name: Release

# Manual, deliberate publish. Trigger from the Actions tab → "Run workflow".
# Runs the full gate, then publishes the public packages to npm with provenance,
# pushes the matching `v<version>` tag, creates/updates the GitHub Release, and
# verifies that npm + tag + release metadata agree. Provenance requires: a
# public repo + id-token:write (OIDC) + the publish running inside this
# workflow. The private @manehorizons/cadence-testkit is skipped automatically
# by `pnpm -r publish` (it has "private": true).
#
# `dry_run` defaults to FALSE: a plain "Run workflow" publishes. Tick the box to
# pack + validate without publishing or tagging (the final pre-publish check).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pack + validate; do NOT publish or tag)'
        type: boolean
        default: false

permissions:
  contents: write # push the release tag
  id-token: write # required for npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the host-claude-code integration tests spawn the *built*
      # core CLI by path, so dist must exist before `test` runs (a single
      # `turbo run test build` races them).
      - run: pnpm build
      - name: Gate (typecheck, lint, test)
        run: pnpm turbo run typecheck lint test
      - name: Publish to npm (provenance)
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          if node scripts/release-integrity.mjs --verify-npm; then
            echo "All public packages already exist on npm at the current version — skipping publish."
            exit 0
          fi
          pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Tag the release (v<version>)
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          # The three public packages are versioned in lockstep; core is the
          # canonical source of the release version.
          version="v$(node -p "require('./packages/core/package.json').version")"
          if git ls-remote --tags origin "refs/tags/${version}" | grep -q "${version}"; then
            echo "Tag ${version} already exists on origin — skipping (idempotent re-run)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${version}" -m "${version} — released via the Release workflow"
          git push origin "${version}"
          echo "Pushed annotated tag ${version}."
      - name: Create GitHub Release and verify registry
        if: ${{ inputs.dry_run == false }}
        run: node scripts/release-integrity.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run (pack only, no publish)
        if: ${{ inputs.dry_run == true }}
        run: pnpm -r publish --access public --no-git-checks --dry-run
