name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'packages/*/src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'packages/*/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scope by ref so a PR build can't cancel an in-flight main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The API docs are generated from packages/*/src via typedoc, which must
      # resolve those packages' imports: external deps (e.g. zod) need the
      # monorepo installed at the repo root, and cross-package imports (e.g.
      # @manehorizons/cadence-types) resolve via each package's built
      # dist/*.d.ts — so install AND build the workspace before the site build.
      # The isolated website install alone is not enough.
      - name: Install monorepo deps (for typedoc source resolution)
        run: pnpm install --frozen-lockfile
      - name: Build packages (typedoc resolves @manehorizons/* via built declarations)
        run: pnpm build
      - name: Install (website)
        working-directory: website
        run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
      - name: Test sync script
        working-directory: website
        run: pnpm test
      - name: Build site
        working-directory: website
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    # Build runs on PRs (validation), but only main/dispatch deploys to Pages.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
